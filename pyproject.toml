[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-makervigate"
version = "0.1.0"
description = "NeoMakerViGate — Cổng Vào Làng Maker với 7 trải nghiệm vision-tracking cho trẻ em"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Maker Việt × Dế Foundation", email = "tuan@rogo.com.vn" },
]
keywords = ["education", "stem", "kids", "mediapipe", "pyqt6", "qml", "vision"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "PyQt6>=6.5",
    "mediapipe>=0.10.18",
    "opencv-python>=4.8",
    "numpy>=1.26,<2.0",
    "Pillow>=10.0",
    "qrcode[pil]>=7.4",
    "loguru>=0.7",
    "tomli>=2.0 ; python_version < '3.11'",
    "requests>=2.31",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.2",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
qwen-local = [
    "llama-cpp-python>=0.2.90",
]
voice = [
    "openai-whisper>=20231117",
    "piper-tts>=1.2",
]
arm64 = [
    # NEO One pin riêng — install bằng requirements-arm64.txt
]

[project.scripts]
neo-makervigate = "neo_makervigate.__main__:main"

[project.urls]
Homepage = "https://github.com/tuanln/NeoMakerViGate"
Issues = "https://github.com/tuanln/NeoMakerViGate/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"neo_makervigate" = [
    "ui/qml/**/*.qml",
    "ui/qml/**/qmldir",
    "config/*.toml",
    "resources/**/*",
    "experiences/**/*.qml",
    "experiences/**/*.toml",
    "experiences/**/assets/*",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "E501",    # line length handled by formatter
    "RUF001",  # ambiguous unicode in strings (we use Vietnamese)
    "RUF002",  # ambiguous unicode in docstrings (Vietnamese × dấu nhân)
    "RUF003",  # ambiguous unicode in comments (Vietnamese)
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = []

[[tool.mypy.overrides]]
module = ["mediapipe.*", "cv2.*", "qrcode.*", "PyQt6.*", "scipy.*"]
ignore_missing_imports = true

# pyqtProperty decorator chưa có type stub đầy đủ — disable strict cho service layer
[[tool.mypy.overrides]]
module = "neo_makervigate.services.app_controller"
disable_error_code = ["misc", "untyped-decorator"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests", "src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: tests chạy chậm (>1s)",
    "hardware: tests cần webcam thật",
    "integration: tests tích hợp nhiều module",
    "e2e: end-to-end tests",
]
